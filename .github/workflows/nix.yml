name: Nix

on:
  push:
    branches:
      - master
    paths:
      - "flake.nix"
      - "flake.lock"
      - "nix/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "Dockerfile"
      - ".github/workflows/nix.yml"
  pull_request:
    paths:
      - "flake.nix"
      - "flake.lock"
      - "nix/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "Dockerfile"
      - ".github/workflows/nix.yml"

permissions:
  contents: read

jobs:
  flake-check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - name: nix version
        run: nix --version

      # Evaluation-only validation: confirms flake.nix parses and every
      # output (packages, devShells, modules, checks, formatter) evaluates
      # cleanly for every advertised system. Does NOT trigger any builds —
      # those happen in the `build` job below where fixed-output hashes
      # come into play.
      - name: nix flake show
        run: nix flake show --all-systems

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Allow the package build to fail without blocking PRs while the
    # pnpm-lock.yaml hash is being kept in sync. Remove `continue-on-error`
    # once hash drift handling lands in CI (e.g. a `chore/refresh-nix-hashes`
    # bot).
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - name: nix build .#paperclip
        run: nix build .#paperclip --print-build-logs
