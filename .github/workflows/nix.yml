name: Nix

on:
  push:
    branches:
      - master
    paths:
      - "flake.nix"
      - "flake.lock"
      - "nix/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "Dockerfile"
      - ".github/workflows/nix.yml"
  pull_request:
    paths:
      - "flake.nix"
      - "flake.lock"
      - "nix/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "Dockerfile"
      - ".github/workflows/nix.yml"

permissions:
  contents: read

jobs:
  flake-check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      # Evaluation-only validation: confirms flake.nix parses, all outputs
      # resolve, and the module/package derivations evaluate cleanly. Does NOT
      # build the package — see doc/NIX.md "Updating dependency hashes" for
      # the first-build hash-resolution flow that must complete before
      # `nix flake check` / `nix build .#paperclip` can run end-to-end in CI.
      - name: nix flake show
        run: nix flake show --no-write-lock-file --all-systems

      - name: nix eval (package + module)
        run: |
          nix eval --no-write-lock-file .#paperclip.drvPath
          nix eval --no-write-lock-file .#paperclip-agent-clis.drvPath || true
          nix eval --no-write-lock-file --raw .#nixosModules.paperclip --apply 'm: builtins.typeOf m'
