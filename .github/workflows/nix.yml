name: Nix

on:
  push:
    branches:
      - master
    paths:
      - "flake.nix"
      - "flake.lock"
      - "nix/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "Dockerfile"
      - ".github/workflows/nix.yml"
  pull_request:
    paths:
      - "flake.nix"
      - "flake.lock"
      - "nix/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "Dockerfile"
      - ".github/workflows/nix.yml"

permissions:
  contents: read

jobs:
  flake-check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - name: nix version
        run: nix --version

      # Structural validation only. `nix flake metadata` parses flake.nix and
      # locks inputs in memory; it does NOT evaluate output derivations, so it
      # works without resolved package/agent-cli hashes.
      #
      # Full evaluation and builds (`nix flake check`, `nix build .#paperclip`)
      # require the `lib.fakeHash` placeholders in nix/package.nix and
      # nix/agent-clis.nix to be replaced with real hashes. See
      # doc/NIX.md "Updating dependency hashes" for the first-build flow.
      - name: nix flake metadata
        run: nix flake metadata --no-write-lock-file
